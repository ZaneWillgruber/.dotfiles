# See https://wiki.hyprland.org/Configuring/Monitors/

# monitor = DP-2, 1920x1080@60, 0x0, 1
monitorv2 {
    output = DP-2
    mode = 1920x1080@60
    position = 0x0
    scale = 1
}

# monitor = HDMI-A-1, 2560x1440@144, 1920x0, 1
monitorv2 {
    output = HDMI-A-1
    mode = 2560x1440@144
    position = 1920x0
    scale = 1
}

# monitor = DP-1, 1920x1080@60, 4480x0, 1
monitorv2 {
    output = DP-1
    mode = 1920x1080@60
    position = 4480x0
    scale = 1
}
